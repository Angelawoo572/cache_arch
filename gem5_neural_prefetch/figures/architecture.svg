<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 770" width="1180" height="770" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">A conventional fast path and a learned slow path share one prefetch issuer</title>
  <desc id="d">Demand loads flow from the out-of-order core through L1D, L2 and the shared LLC to DRAM. Conventional prefetchers observe the access stream and send candidates to a shared issuer. In parallel, causal taps feed a relation memory, a tiny learned predictor and a bounded traversal unit that reads pointer or index fields from arriving lines and sends generated addresses to the same issuer. Labels and training exist only offline.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker>
    <marker id="a-fast" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B85C1E"/></marker>
    <marker id="a-slow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B66A3"/></marker>
    <marker id="a-off" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="770" fill="#ffffff"/>

  <!-- Demand path -->
  <text x="40" y="42" font-size="11" font-weight="bold" letter-spacing="0.6" fill="#555555">DEMAND PATH</text>
  <g fill="#ffffff" stroke="#333333" stroke-width="1.4">
    <rect x="40" y="56" width="210" height="90" rx="4"/>
    <rect x="310" y="56" width="120" height="90" rx="4"/>
    <rect x="490" y="56" width="130" height="90" rx="4"/>
    <rect x="680" y="56" width="210" height="90" rx="4"/>
    <rect x="950" y="56" width="190" height="90" rx="4"/>
  </g>
  <g fill="#222222" text-anchor="middle">
    <text x="145" y="94" font-size="14" font-weight="bold">Out-of-order core</text>
    <text x="145" y="116" font-size="12">load issue · data return · commit</text>
    <text x="370" y="106" font-size="14" font-weight="bold">L1D</text>
    <text x="555" y="106" font-size="14" font-weight="bold">L2</text>
    <text x="785" y="106" font-size="14" font-weight="bold">Shared LLC</text>
    <text x="1045" y="98" font-size="14" font-weight="bold">Memory controller</text>
    <text x="1045" y="117" font-size="14" font-weight="bold">and DRAM</text>
  </g>
  <g stroke="#333333" stroke-width="1.4" fill="none">
    <line x1="250" y1="90" x2="310" y2="90" marker-end="url(#a-ink)"/>
    <line x1="310" y1="112" x2="250" y2="112" marker-end="url(#a-ink)"/>
    <line x1="430" y1="90" x2="490" y2="90" marker-end="url(#a-ink)"/>
    <line x1="490" y1="112" x2="430" y2="112" marker-end="url(#a-ink)"/>
    <line x1="620" y1="90" x2="680" y2="90" marker-end="url(#a-ink)"/>
    <line x1="680" y1="112" x2="620" y2="112" marker-end="url(#a-ink)"/>
    <line x1="890" y1="90" x2="950" y2="90" marker-end="url(#a-ink)"/>
    <line x1="950" y1="112" x2="890" y2="112" marker-end="url(#a-ink)"/>
  </g>

  <!-- Observation trunk shared by both paths -->
  <g stroke="#333333" stroke-width="1.4" fill="none">
    <line x1="110" y1="146" x2="110" y2="470" marker-end="url(#a-ink)"/>
    <polyline points="345,146 345,176 110,176"/>
    <line x1="110" y1="340" x2="360" y2="340" marker-end="url(#a-ink)"/>
  </g>
  <circle cx="110" cy="176" r="3.2" fill="#333333"/>
  <circle cx="110" cy="340" r="3.2" fill="#333333"/>
  <text x="122" y="196" font-size="12" fill="#222222">PC · address · value · outcomes</text>
  <text x="235" y="332" font-size="12" fill="#222222" text-anchor="middle">access stream</text>

  <!-- Shared issuer -->
  <rect x="360" y="206" width="480" height="50" rx="4" fill="#EDEDED" stroke="#333333" stroke-width="1.4"/>
  <circle cx="382" cy="231" r="10" fill="#333333"/>
  <text x="382" y="235.5" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  <text x="400" y="227" font-size="13.5" font-weight="bold" fill="#222222">Shared issuer</text>
  <text x="400" y="245" font-size="12" fill="#222222">translation · legality · de-duplication · queue capacity · bandwidth</text>
  <g stroke="#333333" stroke-width="1.4" fill="none">
    <line x1="555" y1="206" x2="555" y2="146" marker-end="url(#a-ink)"/>
    <line x1="760" y1="206" x2="760" y2="146" marker-end="url(#a-ink)"/>
  </g>
  <text x="657" y="181" font-size="12" fill="#222222" text-anchor="middle">prefetch requests</text>

  <!-- Fast path -->
  <rect x="360" y="300" width="340" height="80" rx="4" fill="#FDEBD9" stroke="#B85C1E" stroke-width="1.4"/>
  <text x="530" y="334" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">Conventional prefetchers</text>
  <text x="530" y="356" font-size="12" fill="#222222" text-anchor="middle">stride · delta · signature tables</text>
  <line x1="660" y1="300" x2="660" y2="256" stroke="#B85C1E" stroke-width="1.6" marker-end="url(#a-fast)"/>
  <text x="670" y="283" font-size="12" fill="#222222">candidates</text>
  <text x="360" y="399" font-size="11" font-weight="bold" letter-spacing="0.6" fill="#B85C1E">FAST PATH · unchanged, never waits for the predictor</text>

  <!-- Learned slow path -->
  <g fill="#E4EEF8" stroke="#2B66A3" stroke-width="1.4">
    <rect x="40" y="470" width="200" height="130" rx="4"/>
    <rect x="280" y="470" width="200" height="130" rx="4"/>
    <rect x="520" y="470" width="210" height="130" rx="4"/>
    <rect x="770" y="470" width="230" height="130" rx="4"/>
  </g>
  <g fill="#2B66A3">
    <circle cx="60" cy="492" r="10"/>
    <circle cx="300" cy="492" r="10"/>
    <circle cx="540" cy="492" r="10"/>
    <circle cx="790" cy="492" r="10"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="60" y="496.5">1</text>
    <text x="300" y="496.5">2</text>
    <text x="540" y="496.5">3</text>
    <text x="790" y="496.5">4</text>
  </g>
  <g font-size="13.5" font-weight="bold" fill="#222222">
    <text x="77" y="497">Causal taps</text>
    <text x="317" y="497">Relation memory</text>
    <text x="557" y="497">Tiny learned predictor</text>
    <text x="807" y="497">Traversal unit</text>
  </g>
  <g font-size="12" fill="#222222">
    <text x="54" y="526">rename: base-register producer</text>
    <text x="54" y="546">load issue: PC, address</text>
    <text x="54" y="566">data return: value, latency</text>
    <text x="54" y="586">resolved prefetch outcomes</text>

    <text x="294" y="526">producer slots: PC tag, value</text>
    <text x="294" y="546">exact check of observed pairs:</text>
    <text x="294" y="566">addr = (value &lt;&lt; s) + b</text>
    <text x="294" y="586">relation entries, confidence</text>

    <text x="534" y="526">gate: add value, or abstain</text>
    <text x="534" y="546">plan emitter: up to K entries</text>
    <text x="534" y="566">(source, field, shift, depth)</text>
    <text x="534" y="586">few-bit choices, not addresses</text>

    <text x="784" y="526">plan buffer; depth ≤ D, width ≤ W</text>
    <text x="784" y="546">reads the pointer or index field</text>
    <text x="784" y="566">from each arriving line, then</text>
    <text x="784" y="586">forms the next address</text>
  </g>
  <g stroke="#2B66A3" stroke-width="1.6" fill="none">
    <line x1="240" y1="535" x2="280" y2="535" marker-end="url(#a-slow)"/>
    <line x1="480" y1="535" x2="520" y2="535" marker-end="url(#a-slow)"/>
    <line x1="730" y1="535" x2="770" y2="535" marker-end="url(#a-slow)"/>
    <line x1="800" y1="470" x2="800" y2="256" marker-end="url(#a-slow)"/>
  </g>
  <text x="792" y="432" font-size="12" fill="#222222" text-anchor="end">generated addresses</text>
  <line x1="870" y1="146" x2="870" y2="470" stroke="#333333" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <text x="880" y="300" font-size="12" fill="#222222">fill tap: contents of each</text>
  <text x="880" y="317" font-size="12" fill="#222222">arriving line, at the level</text>
  <text x="880" y="334" font-size="12" fill="#222222">the plan fills (L2 or LLC)</text>
  <text x="40" y="623" font-size="11" font-weight="bold" letter-spacing="0.6" fill="#2B66A3">LEARNED SLOW PATH · off the demand path; its latency is charged against lead</text>

  <!-- Offline -->
  <rect x="280" y="664" width="720" height="74" rx="4" fill="#F7F7F7" stroke="#777777" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="640" y="693" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Offline only — never visible at prediction time</text>
  <text x="640" y="715" font-size="12" fill="#222222" text-anchor="middle">gem5 traces → future-address sets, dependency graphs, baseline outcomes → training → quantized weights</text>
  <line x1="625" y1="664" x2="625" y2="600" stroke="#777777" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-off)"/>
  <text x="635" y="640" font-size="12" fill="#222222">weights</text>

  <!-- Legend -->
  <line x1="44" y1="686" x2="86" y2="686" stroke="#333333" stroke-width="1.4" marker-end="url(#a-ink)"/>
  <text x="96" y="690" font-size="12" fill="#222222">seen at prediction time</text>
  <line x1="44" y1="714" x2="86" y2="714" stroke="#777777" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-off)"/>
  <text x="96" y="718" font-size="12" fill="#222222">offline labels and training</text>
</svg>
