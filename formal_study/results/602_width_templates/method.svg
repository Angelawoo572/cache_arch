<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<style>text{font:15px sans-serif;fill:#193047}.title{font-size:22px;font-weight:bold}.small{font-size:14px}.box{fill:#f1f6fb;stroke:#3a5f7b;stroke-width:1.4}.template{fill:#fff7e8;stroke:#a26b14;stroke-width:1.4}.a{fill:none;stroke:#496b85;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#496b85"/></marker></defs>
<rect width="1200" height="470" fill="white"/>
<text class="title" x="28" y="35">602: recover each original model, then test its frozen simple template</text>
<rect class="box" x="28" y="64" width="245" height="110" rx="9"/>
<text x="44" y="91">Own teacher actions → training</text><text class="small" x="44" y="117">Original 0–20M training records</text><text class="small" x="44" y="140">AMPM / SPP: retained seed7 H16</text><text class="small" x="44" y="161">Separate H8 references remain H8</text>
<path class="a" d="M273 120H315"/>
<rect class="box" x="315" y="64" width="253" height="110" rx="9"/>
<text x="332" y="91">Frozen weights + live C++</text><text class="small" x="332" y="117">Global h/c evolves per callback</text><text class="small" x="332" y="140">Actual-build state / action parity</text><text class="small" x="332" y="161">MAC0: synchronous full forward</text>
<path class="a" d="M568 120H611"/>
<rect class="template" x="611" y="64" width="253" height="110" rx="9"/>
<text x="628" y="91">Own validation: 20–25M</text><text class="small" x="628" y="117">Freeze modal K + slot delta / fill</text><text class="small" x="628" y="140">Address-relative template, no PC</text><text class="small" x="628" y="161">No fitting or selection on test</text>
<path class="a" d="M864 120H908"/>
<rect class="box" x="908" y="64" width="264" height="110" rx="9"/>
<text x="925" y="91">Two full 25M test ROIs</text><text class="small" x="925" y="117">25–50M / 75–100M, 5M warmup</text><text class="small" x="925" y="140">Full NN vs frozen no-NN template</text><text class="small" x="925" y="161">Uncapped / cap 16,144 requests/M</text>
<text x="28" y="216" font-weight="bold">Live event boundary</text>
<rect class="box" x="28" y="238" width="245" height="112" rx="9"/>
<text x="44" y="267">L2 LOAD callbacks</text><text class="small" x="44" y="292">Aligned address bits; SPP D/F kind</text><text class="small" x="44" y="316">SPP real raw fills also advance h/c</text><text class="small" x="44" y="338">Address-only models: no PC</text>
<path class="a" d="M273 294H315"/>
<rect class="box" x="315" y="238" width="253" height="112" rx="9"/>
<text x="332" y="267">Independent prediction arm</text><text class="small" x="332" y="292">NN: complete forward + decoder</text><text class="small" x="332" y="316">Template: frozen relative actions</text><text class="small" x="332" y="338">Original per-route state / fill rules</text>
<path class="a" d="M568 294H611"/>
<rect class="template" x="611" y="238" width="253" height="112" rx="9"/>
<text x="628" y="267">Filter + request credit</text><text class="small" x="628" y="292">Identical page and cap contract</text><text class="small" x="628" y="316">Accepted / merged / rejected tracked</text><text class="small" x="628" y="338">Common ceiling ≠ same traffic</text>
<path class="a" d="M864 294H908"/>
<rect class="box" x="908" y="238" width="264" height="112" rx="9"/>
<text x="925" y="267">Cache / DRAM measurement</text><text class="small" x="925" y="292">IPC; requests/M; DRAM bus bytes</text><text class="small" x="925" y="316">L2 / LLC intent-cohort metrics</text><text class="small" x="925" y="338">Whole-ROI + phase distributions</text>
<text class="small" x="28" y="389">Warmup: caches observe 5M with prefetch output disabled; NN state retained into ROI. MAC0 has no modeled queue/service latency.</text>
<text class="small" x="28" y="415">Teacher references use compatible controls; old replay IPC stays separate. Requests × 64 is not DRAM traffic.</text>
<text class="small" x="28" y="441">Frozen-template replication tests payload necessity for these checkpoints. Failure to match does not prove a stateful innovation.</text>
</svg>
