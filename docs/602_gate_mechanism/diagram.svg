<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203548}.title{font-size:34px;font-weight:700;fill:#172f4a}.subtitle{font-size:19px;fill:#5c6d7d}.band{font-size:17px;font-weight:700;letter-spacing:1.2px;fill:#2768a2}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#5c6d7d}.arrow{stroke:#2768a2;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><rect width="1600" height="1220" fill="white"/>
<text x="52" y="62" class="title">Separate the learned request gate from the predicted payload</text>
<text x="52" y="95" class="subtitle">Implemented mechanism study · frozen weights · no outcome claim before the formal data audit</text>
<rect x="35" y="124" width="1530" height="66" rx="12" fill="#edf5fc"/>
<text x="55" y="151" class="body">Question: does the model choose useful addresses, identify useful emitting PCs/events, or mainly change request volume?</text>
<text x="55" y="176" class="body">A shared request ceiling and explicit payload interventions test these explanations separately.</text>
<text x="55" y="227" class="band">OFFLINE: FIT THE MINIMAL PC CONTROL WITHOUT TEST DATA</text>
<rect x="55" y="247" width="310" height="142" rx="12" fill="#f2f6fb" stroke="#b5cada" stroke-width="1.5"/>
<text x="73" y="279" class="head">Complete NoPF streams</text>
<text x="73" y="310" class="body">Train 0–1M + validation 5–10M</text>
<text x="73" y="335" class="body">Full EOF; independent split state = 0</text>
<text x="73" y="360" class="body">No test inputs / no 4096 prefix</text>
<rect x="425" y="247" width="310" height="142" rx="12" fill="#f2f6fb" stroke="#b5cada" stroke-width="1.5"/>
<text x="443" y="279" class="head">Score each frozen seed</text>
<text x="443" y="310" class="body">Scalar NN; exact 64-entry LRU</text>
<text x="443" y="335" class="body">Record raw emit votes per PC</text>
<text x="443" y="360" class="body">Output limit 32; full forward</text>
<rect x="795" y="247" width="310" height="142" rx="12" fill="#f2f6fb" stroke="#b5cada" stroke-width="1.5"/>
<text x="813" y="279" class="head">Fixed fitting rule</text>
<text x="813" y="310" class="body">Top 64 combined event frequency</text>
<text x="813" y="335" class="body">PC ascending breaks count ties</text>
<text x="813" y="360" class="body">Emit majority ≥ 0.5; no sweep</text>
<rect x="1165" y="247" width="380" height="142" rx="12" fill="#edf7f3" stroke="#b5cada" stroke-width="1.5"/>
<text x="1183" y="279" class="head">Frozen PC table</text>
<text x="1183" y="310" class="body">PC + valid + one gate bit</text>
<text x="1183" y="335" class="body">Absent PC remains silent</text>
<text x="1183" y="360" class="body">No recurrent state / runtime training</text>
