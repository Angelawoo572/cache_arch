<text x="338" y="708" class="body">Gate on raw NN emit</text>
<text x="338" y="733" class="body">Keep decoder work + h/c</text>
<rect x="715" y="645" width="300" height="122" rx="12" fill="#edf7f3" stroke="#b5cada" stroke-width="1.5"/>
