<text x="733" y="1008" class="body">Absent PC: no request</text>
<rect x="1060" y="945" width="485" height="122" rx="12" fill="#f7f9fc" stroke="#b5cada" stroke-width="1.5"/>
<text x="1078" y="977" class="head">Same output interface</text>
<text x="1078" y="1008" class="body">Current-line filter: on</text>
<text x="1078" y="1033" class="body">Same page → shared cap → cache</text>
<path d="M670 1006L715 1006" class="arrow"/>
<path d="M1015 1006L1060 1006" class="arrow"/>
<line x1="55" y1="1094" x2="1545" y2="1094" stroke="#d3dce5" stroke-width="1.5"/>
<text x="55" y="1123" class="body">Common: two future 25M ROIs · 5M NoPF cache warmup / NN history · same-page policy · original or 2363 requests/M ceiling</text>
<text x="55" y="1152" class="small">Three training seeds at MAC0; MAC4 is a seed 7 capped learned-payload subset. Actual traffic can differ under the same ceiling.</text>
<text x="55" y="1178" class="small">Arrival-time shadow Stride is diagnostic only. Full-ROI/5M-phase distributions and actual silent-output intervention support attribution.</text>
